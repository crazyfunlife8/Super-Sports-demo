name: Sync Scores

on:
  schedule:
    - cron: '0 12 * * *'   # UTC 12:00 = 台灣 20:00（NPB 下午場補分）
    - cron: '0 14 * * *'   # UTC 14:00 = 台灣 22:00（NPB/CPBL 晚場補分）
    - cron: '0 16 * * *'   # UTC 16:00 = 台灣 00:00（CPBL 收尾補漏）
  workflow_dispatch:        # 允許手動觸發

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run score sync
        run: node scripts/sync-scores-actions.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
